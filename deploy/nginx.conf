# Replace api.example.com and certificate paths. Place in an HTTPS reverse proxy.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
server {
    listen 443 ssl;
    server_name api.example.com;
    ssl_certificate /etc/ssl/todaygo/fullchain.pem;
    ssl_certificate_key /etc/ssl/todaygo/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 64k;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    location /api/auth/ {
        limit_req zone=auth burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        # No token-bearing query strings or authorization headers in logs.
        access_log off;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
server {
    listen 80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}
