services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: todaygo
      POSTGRES_USER: todaygo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD securely}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U todaygo -d todaygo]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://todaygo:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/todaygo
    depends_on:
      db:
        condition: service_healthy
    ports: ["127.0.0.1:8000:8000"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    restart: unless-stopped
volumes:
  database:
