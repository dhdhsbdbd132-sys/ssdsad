name: Publish verified Android APK

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'ID успешной сборки Android debug APK'
        required: true
        type: string
      tag:
        description: 'Тег релиза'
        required: true
        default: v1.2.0
        type: string

concurrency:
  group: publish-android-${{ inputs.tag }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout publication tools
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: publisher
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - name: Download and authenticate build artifact
        id: package
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          python publisher/scripts/publish_android_release.py download
          --run-id "$BUILD_RUN_ID" --tag "$RELEASE_TAG"
          --directory "$RUNNER_TEMP/todaygo-release-$GITHUB_RUN_ID"
      - name: Checkout exact APK source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.package.outputs.source_sha }}
          path: build-source
          persist-credentials: false
      - name: Native verification tools
        run: |
          command -v readelf
          test -n "$ANDROID_HOME"
          test -d "$ANDROID_HOME/build-tools"
      - name: Verify signature, Android metadata and every native library
        run: >-
          python publisher/scripts/publish_android_release.py verify
          --directory "$RUNNER_TEMP/todaygo-release-$GITHUB_RUN_ID"
          --source-directory "$GITHUB_WORKSPACE/build-source"
      - name: Upload draft assets and publish release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python publisher/scripts/publish_android_release.py publish
          --directory "$RUNNER_TEMP/todaygo-release-$GITHUB_RUN_ID"
