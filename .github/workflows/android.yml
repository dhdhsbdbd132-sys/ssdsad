name: Android debug APK
on:
  workflow_dispatch:
concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - name: Android toolchain cache
        id: android-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            ~/.buildozer/android/platform
            ~/.gradle/caches
            ~/.gradle/wrapper
            client/.buildozer/android/platform
          key: android-arm64-p4a-2026-05-09-grpfix-${{ runner.os }}-${{ hashFiles('client/buildozer.spec', 'client/android-recipes/**') }}
      - name: Native build tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          python -m pip install buildozer==1.6.0 Cython==0.29.37 setuptools==82.0.1
      - name: Build
        working-directory: client
        shell: bash
        run: |
          mkdir -p ../.data
          buildozer android debug 2>&1 | tee ../.data/android-build.log
      - name: Verify APK and create checksums
        working-directory: client
        shell: bash
        run: |
          python ../scripts/verify_android_apk.py bin
          cd bin
          sha256sum *.apk > SHA256SUMS.txt
          printf 'Source commit: %s\nArchitecture: arm64-v8a\nVersion: 1.2.0\nBuild: debug\n' "$GITHUB_SHA" > BUILD.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: todaygo-debug-apk
          path: |
            client/bin/*.apk
            client/bin/SHA256SUMS.txt
            client/bin/BUILD.txt
          if-no-files-found: error
          retention-days: 30
      - name: Build log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-build-log
          path: .data/android-build.log
          if-no-files-found: ignore
      - name: Save Android toolchain cache
        if: always() && steps.android-cache.outputs.cache-hit != 'true' && steps.android-cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            ~/.buildozer/android/platform
            ~/.gradle/caches
            ~/.gradle/wrapper
            client/.buildozer/android/platform
          key: ${{ steps.android-cache.outputs.cache-primary-key }}
